name: P0 Browser Reverse-Leg Gate

on:
  push:
    branches:
      - p0-reverse-leg-hardening
  pull_request:
    branches:
      - via-evidence-layer
  workflow_dispatch:

jobs:
  browser-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: TypeScript + Vite production build
        run: npm run build

      - name: Verify VIA browser proving assets
        run: npm run verify:via-runtime
