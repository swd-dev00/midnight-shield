name: VIA Browser Build Check

on:
  push:
    branches:
      - via-evidence-layer
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify VIA runtime inputs
        run: npm run verify:via-runtime

      - name: Typecheck and build browser app
        run: npm run build
